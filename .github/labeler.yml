# https://github.com/actions/labeler

# Add 'repo' label to any root file changes
repo:
- changed-files:
  - any-glob-to-any-file: '*'

# Add 'pattern' label to any change to blog post files
pattern:
- changed-files:
  - any-glob-to-any-file: 'pattern/**'

# Add 'author-added' label
author-added:
- changed-files:
  - any-glob-to-any-file: 'author/**'

# Add 'lintjs' to any change to lint.js
lintjs:
- changed-files:
  - any-glob-to-any-file: 'lint.js'

# Add 'workflow' label
workflow:
- changed-files:
  - any-glob-to-any-file: '.github/workflows/**'
